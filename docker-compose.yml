services:  
  database:
    image: postgres:18.4-alpine
    volumes:
      - ./finance-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    
  backend:
    image: raidlyne/financial-system-backend:1.0
    ports:
      - "5192:5192"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    
  frontend:
    image: raidlyne/financial-system-frontend:1.0
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:5173"
    restart: unless-stopped